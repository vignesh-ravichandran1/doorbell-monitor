server {
    listen 80;
    root /recordings;
    index index.html;

    location / {
        autoindex on;
        # Clips change only when new ones are added; always show the fresh list.
        add_header Cache-Control "no-cache";
    }

    location ~ \.mp4$ {
        # nginx handles Range requests, so seeking works (required by iPhone Safari).
        types { video/mp4 mp4; }
    }
}
